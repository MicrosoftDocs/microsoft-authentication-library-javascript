inheritedMethods:
  - name: isBrowserRequired()
    uid: '@azure/msal-browser.SubmitNewPasswordErrorV2.isBrowserRequired'
    package: '@azure/msal-browser'
    summary: |-
      Checks if the error requires the flow to continue in the browser. The
      server surfaces this as a `redirect_to_web` failure, so a browser hand-off
      always arrives as a `FailedStateV2` on which this detector returns true.
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'function isBrowserRequired(): boolean'
      return:
        description: True if the browser is required, false otherwise.
        type: boolean
    inheritanceDescription: <b>Inherited From</b> AuthFlowErrorBaseV2.isBrowserRequired
  - name: isInvalidInput()
    uid: '@azure/msal-browser.SubmitNewPasswordErrorV2.isInvalidInput'
    package: '@azure/msal-browser'
    summary: >-
      Checks if the error is due to a caller-supplied argument failing

      client-side validation before the request was issued (for example an empty

      username, code, or password, or an unknown method id). Use it to prompt
      the

      user to correct the input rather than treating it as a server failure.
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'function isInvalidInput(): boolean'
      return:
        description: True if the input was invalid, false otherwise.
        type: boolean
    inheritanceDescription: <b>Inherited From</b> AuthFlowErrorBaseV2.isInvalidInput
  - name: isUserAlreadyExists()
    uid: '@azure/msal-browser.SubmitNewPasswordErrorV2.isUserAlreadyExists'
    package: '@azure/msal-browser'
    summary: |-
      Checks whether an account already exists for the supplied identifier.
      This can occur at different stages while completing sign-up.
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'function isUserAlreadyExists(): boolean'
      return:
        description: True if the account already exists, otherwise false.
        type: boolean
    inheritanceDescription: <b>Inherited From</b> AuthFlowErrorBaseV2.isUserAlreadyExists
methods:
  - name: isInvalidPassword()
    uid: '@azure/msal-browser.SubmitNewPasswordErrorV2.isInvalidPassword'
    package: '@azure/msal-browser'
    summary: |-
      Checks if the error is due to the new password being invalid, for example
      because it fails the tenant's complexity policy. Use it to prompt the user
      for a stronger password rather than restarting the reset flow.
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'function isInvalidPassword(): boolean'
      return:
        description: True if the new password is invalid, false otherwise.
        type: boolean
