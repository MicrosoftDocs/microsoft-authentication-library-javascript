    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        function sendAndAwait<TReq>(message: TReq, send:
        WebBrokerBridgeSendFn<TReq>): Promise<TResp>
      parameters:
        - id: message
          type: TReq
          description: ''
        - id: send
          type: <xref uid="@azure/msal-browser.WebBrokerBridgeSendFn" />&lt;TReq&gt;
          description: ''
      return:
        description: ''
        type: Promise&lt;TResp&gt;
