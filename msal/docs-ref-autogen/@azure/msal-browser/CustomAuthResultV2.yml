  - name: isFailed()
    uid: '@azure/msal-browser.CustomAuthResultV2.isFailed'
    package: '@azure/msal-browser'
    summary: |-
      Checks whether the result is in the terminal failed state. A failed result
      contains the flow-specific error.
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        function isFailed(): this is CustomAuthResultV2<TState, TError, TData> &
        { state: Extract<TState, { stateType: "failed" }> }
      return:
        description: True (and narrows `state`) when the operation failed.
        type: >-
