          Extract&lt;TState, { stateType: "failed" }&gt; }
  - name: isState<TType>(TType)
    uid: '@azure/msal-browser.CustomAuthResultV2.isState'
    package: '@azure/msal-browser'
    summary: |-
      Narrows the result to a specific state by its `stateType` discriminator.
      A successful match makes the state's properties available without a cast.
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        function isState<TType>(stateType: TType): this is
        CustomAuthResultV2<TState, TError, TData> & { state: Extract<TState, {
        stateType: TType }> }
      parameters:
        - id: stateType
          type: TType
          description: The state type to test for.
      return:
        description: True (and narrows `state`) when the current state matches `stateType`.
        type: >-
          this is CustomAuthResultV2&lt;TState, TError, TData&gt; & { state:
          Extract&lt;TState, { stateType: TType }&gt; }
