    package: '@azure/msal-browser'
    summary: >-
      Checks if the error is due to a caller-supplied argument failing

      client-side validation before the request was issued (for example an empty

      username, code, or password, or an unknown method id). Use it to prompt
      the

      user to correct the input rather than treating it as a server failure.
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'function isInvalidInput(): boolean'
      return:
        description: True if the input was invalid, false otherwise.
        type: boolean
    inheritanceDescription: <b>Inherited From</b> AuthFlowErrorBaseV2.isInvalidInput
  - name: isUserAlreadyExists()
