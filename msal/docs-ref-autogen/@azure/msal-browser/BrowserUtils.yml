  - name: buildMergedClaims(string, string[], string, string)
    uid: '@azure/msal-browser.BrowserUtils.buildMergedClaims'
    package: '@azure/msal-browser'
    summary: >-
      Parses claims JSON, optionally deep-merges a second client-originated
      claims string

      (`claimsToMerge`, e.g. `claimsFromClient`) with precedence on conflicting
      keys, merges

      default optional idToken claims (signin_state, login_hint,
      tenant_region_sub_scope), and appends client

      capabilities (xms_cc) to the access_token section

      Does not overwrite idToken claims already specified by the caller.
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        function buildMergedClaims(claims?: string, clientCapabilities?:
        string[], correlationId?: string, claimsToMerge?: string): string
      parameters:
        - id: claims
          type: string
          description: Existing claims JSON string from the request (may be undefined)
        - id: clientCapabilities
          type: string[]
          description: Client capabilities array from configuration
        - id: correlationId
          type: string
          description: The request correlation id
        - id: claimsToMerge
          type: string
          description: >-
            Optional second claims JSON string (e.g. client-originated
            `claimsFromClient`)

            deep-merged into `claims` with precedence on conflicts; parsed and
            validated when present. Nested

            objects are merged recursively; arrays and scalar values are
            replaced.
      return:
        description: Merged claims JSON string
        type: string
