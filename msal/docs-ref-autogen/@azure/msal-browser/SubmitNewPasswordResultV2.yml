### YamlMime:TSTypeAlias
name: SubmitNewPasswordResultV2
uid: '@azure/msal-browser.SubmitNewPasswordResultV2'
package: '@azure/msal-browser'
summary: >-
  Result of submitting a new password. It wraps one of

  [SubmitNewPasswordResultStateV2](xref:@azure/msal-browser.SubmitNewPasswordResultStateV2)
  plus, on failure, a

  [SubmitNewPasswordErrorV2](xref:@azure/msal-browser.SubmitNewPasswordErrorV2).
  Submitting completes the reset but does not

  sign the user in, so a successful result reaches

  `SignInContinuationStateV2` and carries no account data; the account is

  surfaced by the subsequent sign-in.
fullName: SubmitNewPasswordResultV2
remarks: ''
isDeprecated: false
syntax: |
  type SubmitNewPasswordResultV2 = CustomAuthResultV2<
    SubmitNewPasswordResultStateV2,
    SubmitNewPasswordErrorV2
  >
