### YamlMime:TSTypeAlias
name: UserFederatedIdentityCredentialRequest
uid: '@azure/msal-node.UserFederatedIdentityCredentialRequest'
package: '@azure/msal-node'
summary: |+
  Request object for acquireTokenByUserFederatedIdentityCredential.

  Required fields: `scopes`, `assertion`, and exactly one of
  `userObjectId` or `username`. Other base-request fields
  (`authority`, `correlationId`, etc.) are filled in by the library.

  **Example**

  ```typescript
  const request: UserFederatedIdentityCredentialRequest = {
      scopes: ["https://graph.microsoft.com/.default"],
      assertion: instanceTokenFromLeg2,
      username: "user@contoso.com",
  };
  ```

fullName: UserFederatedIdentityCredentialRequest
remarks: ''
isDeprecated: false
syntax: |
  type UserFederatedIdentityCredentialRequest = Partial<
    Omit<
      CommonUserFederatedIdentityCredentialRequest,
      | "scopes"
      | "assertion"
      | "resourceRequestMethod"
      | "resourceRequestUri"
      | "clientAssertion"
    >
  > & {
    assertion: string
    clientAssertion?: string | ClientAssertionCallback
    scopes: string[]
    userObjectId?: string
    username?: string
  }
