  - name: normalizeUrlForComparison(string, Logger, string)
    uid: '@azure/msal-common.UrlUtils.normalizeUrlForComparison'
    package: '@azure/msal-common'
    summary: >-
      Normalizes URLs for comparison per MDN & RFC 3986 standards:

      - Hash/fragment is removed

      - Scheme and host are lowercased (case-insensitive per spec)

      - Path and query parameters preserve original casing (case-sensitive per
      spec)

      - Percent-encoding in pathname is normalized (e.g., %27 and ' are treated
      equivalently)

      - Ensures pathname ends with /

      Throws a urlParseError if the provided URL is malformed and cannot be
      parsed.
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        function normalizeUrlForComparison(url: string, logger?: Logger,
        correlationId?: string): string
      parameters:
        - id: url
          type: string
          description: URL to normalize
        - id: logger
          type: <xref uid="@azure/msal-common.Logger" />
          description: Optional logger used to log parse failures
        - id: correlationId
          type: string
          description: Optional correlationId associated with the log entry
      return:
        description: Normalized URL string for comparison
        type: string
  - name: stripLeadingHashOrQuery(string)
    uid: '@azure/msal-common.UrlUtils.stripLeadingHashOrQuery'
