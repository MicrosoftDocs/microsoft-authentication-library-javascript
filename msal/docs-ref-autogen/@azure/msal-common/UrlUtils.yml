  - name: validateUrl(string, Logger, string)
    uid: '@azure/msal-common.UrlUtils.validateUrl'
    package: '@azure/msal-common'
    summary: >-
      Validates that the provided value is a well-formed, parseable absolute
      URL.

      Throws a urlParseError if the value cannot be parsed by the URL API (e.g.
      the

      literal string "null", an empty string, or any malformed/relative URL).
      Use this

      to guard against persisting an invalid value (such as a redirect URL) to
      the cache.
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        function validateUrl(url: string, logger?: Logger, correlationId?:
        string)
      parameters:
        - id: url
          type: string
          description: URL to validate
        - id: logger
          type: <xref uid="@azure/msal-common.Logger" />
          description: Optional logger used to log validation failures
        - id: correlationId
          type: string
          description: Optional correlationId associated with the log entry
